<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yen Bangunan — 3D Hologram</title>
<style>
  :root{
    --bg:#050506;
    --orange:#ff6a1f;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:var(--bg);}
  #stage{
    position:fixed;inset:0;
    /* subtle dark-navy topographic glow behind the model (industrial futuristic mood) */
    background:
      radial-gradient(120% 90% at 50% 42%, rgba(20,32,52,0.55) 0%, rgba(8,12,20,0.35) 32%, rgba(2,3,5,0.9) 66%, #020305 100%),
      radial-gradient(60% 45% at 50% 55%, rgba(120,60,20,0.10) 0%, rgba(0,0,0,0) 60%),
      #030304;
  }
  canvas{display:block;}
  /* faint scanline / grain overlay for the "hologram screen" feel */
  #grain{
    position:fixed;inset:0;pointer-events:none;opacity:.05;mix-blend-mode:screen;
    background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.6) 0 1px, transparent 1px 3px);
  }
  #vignette{
    position:fixed;inset:0;pointer-events:none;
    box-shadow:inset 0 0 260px 60px rgba(0,0,0,.9);
  }
  #hint{
    position:fixed;left:0;right:0;bottom:26px;text-align:center;
    font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
    font-size:12px;letter-spacing:.28em;color:rgba(255,150,90,.55);
    text-transform:uppercase;pointer-events:none;
    transition:opacity .8s ease;user-select:none;
  }
  #hint.hide{opacity:0;}
  #err{
    position:fixed;inset:0;display:none;place-items:center;
    font-family:ui-monospace,monospace;color:#ff8a3d;background:#050506;
    text-align:center;padding:24px;line-height:1.6;
  }
</style>
</head>
<body>
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="grain"></div>
  <div id="vignette"></div>
  <div id="hint">Gerakkan mouse untuk berinteraksi</div>
  <div id="err">Gagal memuat pustaka 3D.<br>Pastikan ada koneksi internet, lalu buka ulang halaman ini.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  if(typeof THREE === "undefined"){ document.getElementById("err").style.display="grid"; return; }

  const ORANGE      = 0xff6a1f;   // core lines
  const ORANGE_DIM  = 0xd85416;   // secondary / glass
  const ORANGE_NODE = 0xffb066;   // glowing joints

  const canvas   = document.getElementById("c");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  const scene = new THREE.Scene();
  scene.fog   = new THREE.FogExp2(0x000000, 0.022); // depth fade like the reference

  const camera = new THREE.PerspectiveCamera(46, window.innerWidth/window.innerHeight, 0.1, 400);
  camera.position.set(0, 1.7, 18.5);
  camera.lookAt(0, 6.2, 0);

  // ---------------------------------------------------------------------------
  //  Helpers to build glowing wireframe pieces
  // ---------------------------------------------------------------------------
  const model = new THREE.Group();
  scene.add(model);

  const nodePositions = [];                       // collected joint positions -> glow points
  const revealables   = [];                       // { obj, target, y } for the build-up intro

  function registerReveal(obj, target, revealY){
    obj.material.opacity = 0;
    revealables.push({ obj, target, y: revealY });
  }
  function minYOf(geom){
    geom.computeBoundingBox();
    return geom.boundingBox.min.y;
  }

  function edgeMat(color, opacity){
    return new THREE.LineBasicMaterial({
      color, transparent:true, opacity,
      blending:THREE.AdditiveBlending, depthWrite:false
    });
  }

  // Add edges of a geometry (geometry must already be positioned in world/local space)
  function addEdges(geom, opacity, color, angle){
    const eg  = new THREE.EdgesGeometry(geom, angle || 1);
    const seg = new THREE.LineSegments(eg, edgeMat(color || ORANGE, opacity));
    model.add(seg);
    registerReveal(seg, opacity, minYOf(eg));
    return eg;
  }

  // Raw line segments from a flat [x,y,z, ...] array
  function addSeg(pts, opacity, color){
    const g=new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(pts,3));
    const seg=new THREE.LineSegments(g, edgeMat(color||ORANGE, opacity));
    model.add(seg);
    registerReveal(seg, opacity, minYOf(g));
    return seg;
  }

  // Box positioned at (x,y,z), edges added, corners registered as glow nodes
  let collectNodes = false;                        // only key structure emits glow dots
  function addBox(w,h,d, x,y,z, opacity, color){
    const g = new THREE.BoxGeometry(w,h,d);
    g.translate(x,y,z);
    addEdges(g, opacity, color, 1);
    if(!collectNodes) return;
    const hw=w/2, hh=h/2, hd=d/2;
    for(let sx=-1;sx<=1;sx+=2)
      for(let sy=-1;sy<=1;sy+=2)
        for(let sz=-1;sz<=1;sz+=2)
          nodePositions.push(x+sx*hw, y+sy*hh, z+sz*hd);
  }

  // Grid of mullion lines on a plane (for glass / floor tech density)
  function addGrid(x0,x1, y0,y1, z, cols, rows, opacity, color){
    const pts=[];
    for(let i=0;i<=cols;i++){ const x=x0+(x1-x0)*i/cols; pts.push(x,y0,z, x,y1,z); }
    for(let j=0;j<=rows;j++){ const y=y0+(y1-y0)*j/rows; pts.push(x0,y,z, x1,y,z); }
    addSeg(pts, opacity, color||ORANGE_DIM);
  }

  // Bolder structural member: normal edges + faint oversized halo -> reads "thick"
  function addThickBox(w,h,d, x,y,z, opacity, color){
    addBox(w,h,d, x,y,z, opacity, color);
    const g = new THREE.BoxGeometry(w*1.05, h*1.02, d*1.05);
    g.translate(x,y,z);
    addEdges(g, opacity*0.32, color || ORANGE, 1);
  }

  // Corrugated deck underside: parallel ribs (structural joists)
  function addCorrugation(x0,x1, z0,z1, y, count, opacity){
    const pts=[];
    for(let i=0;i<=count;i++){ const z=z0+(z1-z0)*i/count; pts.push(x0,y,z, x1,y,z); }
    addSeg(pts, opacity, ORANGE);
  }

  // Vertical ring in the XY plane (grid bubble / connection marker)
  function addRing(cx,cy,cz, r, opacity, color, segs){
    segs = segs || 28;
    const pts=[];
    for(let i=0;i<segs;i++){
      const a0=i/segs*Math.PI*2, a1=(i+1)/segs*Math.PI*2;
      pts.push(cx+Math.cos(a0)*r, cy+Math.sin(a0)*r, cz, cx+Math.cos(a1)*r, cy+Math.sin(a1)*r, cz);
    }
    addSeg(pts, opacity, color||ORANGE_DIM);
  }

  // Small glowing label plane (grid letters)
  function makeLabel(text, worldW, x,y,z, revealY){
    const cv=document.createElement("canvas"); cv.width=256; cv.height=256;
    const g=cv.getContext("2d");
    g.fillStyle="#ffb066"; g.shadowColor="#ff7a2a"; g.shadowBlur=14;
    g.font="700 150px ui-monospace, Menlo, monospace";
    g.textAlign="center"; g.textBaseline="middle";
    g.fillText(text, 128, 138);
    const tex=new THREE.CanvasTexture(cv); tex.anisotropy=4;
    const mat=new THREE.MeshBasicMaterial({map:tex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide});
    const p=new THREE.Mesh(new THREE.PlaneGeometry(worldW, worldW), mat);
    p.position.set(x,y,z); model.add(p);
    registerReveal(p, 1, revealY==null?y:revealY);
    return p;
  }

  // Architect-style annotation text (dim, supporting accessory), centred
  function annot(text, worldH, x,y,z, opacity){
    const fs=64, pad=10;
    const meas=document.createElement("canvas").getContext("2d");
    meas.font=`600 ${fs}px ui-monospace, Menlo, monospace`;
    const tw=Math.ceil(meas.measureText(text).width);
    const cv=document.createElement("canvas"); cv.width=tw+pad*2; cv.height=fs+pad*2;
    const g=cv.getContext("2d");
    g.font=`600 ${fs}px ui-monospace, Menlo, monospace`;
    g.textAlign="center"; g.textBaseline="middle";
    g.fillStyle="#e69a4e"; g.shadowColor="#ff7a2a"; g.shadowBlur=8;
    g.fillText(text, cv.width/2, cv.height/2);
    const tex=new THREE.CanvasTexture(cv); tex.anisotropy=4;
    const mat=new THREE.MeshBasicMaterial({map:tex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide});
    const w=worldH*(cv.width/cv.height);
    const p=new THREE.Mesh(new THREE.PlaneGeometry(w, worldH), mat);
    p.position.set(x,y,z); model.add(p);
    registerReveal(p, opacity==null?0.7:opacity, y-0.4);
    return p;
  }

  // Arc in the XY plane (angle callouts, compass)
  function addArc(cx,cy,cz, r, a0,a1, opacity, color){
    const segs=Math.max(6, Math.round(Math.abs(a1-a0)/(Math.PI*2)*44));
    const pts=[];
    for(let i=0;i<segs;i++){
      const t0=a0+(a1-a0)*i/segs, t1=a0+(a1-a0)*(i+1)/segs;
      pts.push(cx+Math.cos(t0)*r, cy+Math.sin(t0)*r, cz, cx+Math.cos(t1)*r, cy+Math.sin(t1)*r, cz);
    }
    addSeg(pts, opacity, color||ORANGE_DIM);
  }

  // Small survey/target crosshair (geometric accessory)
  function crosshair(x,y,z, s, op){
    addSeg([x-s,y,z, x+s,y,z, x,y-s,z, x,y+s,z], op, ORANGE_DIM);
    addRing(x,y,z, s*0.62, op, ORANGE_DIM, 20);
  }

  // ---------------------------------------------------------------------------
  //  THE BUILDING  (Yen Bangunan, stylised)
  //  centred on origin | base at y=0 | front facade toward +Z
  // ---------------------------------------------------------------------------
  const W = 11, D = 8, H = 9;                       // overall width / depth / height
  const frontZ = D/2;                               // +4

  // -- base platform (the plate the model sits on, as in the reference) --------
  addBox(W+7, 0.25, D+7, 0, -0.15, 0, 0.30, ORANGE_DIM);
  addGrid(-(W+7)/2,(W+7)/2, -0.15,-0.15, 0, 10, 8, 0.10, ORANGE_DIM); // faint ground grid (flat)

  // -- outer shell (open front) ------------------------------------------------
  collectNodes = true;                              // glow dots on the main silhouette only
  addBox(0.3, H, D, -W/2, H/2, 0, 0.55);            // left wall
  addBox(0.3, H, D,  W/2, H/2, 0, 0.55);            // right wall (tall blank side)
  addBox(W,   H, 0.3, 0, H/2, -D/2, 0.45);          // back wall
  addBox(W, 0.35, D, 0, H, 0, 0.55);                // roof slab
  addBox(W, 0.3,  D, 0, 0, 0, 0.40);                // ground slab
  collectNodes = false;

  // -- interior structure (seen through the arch) ------------------------------
  const COLX  = [-3.4, 0, 3.4];
  const FLOOR = [3.3, 5.9];                          // two visible deck levels

  // deeper glass curtain wall (subtle backdrop)
  addGrid(-3.7, 3.7, 2.9, 6.4, -1.0, 6, 4, 0.16, ORANGE_DIM);

  // floor decks + corrugated ribbed undersides (fills the cavity)
  FLOOR.forEach(fy => {
    addThickBox(W-1.8, 0.30, D-1.6, 0, fy, -0.3, 0.55);        // slab
    addCorrugation(-4.0, 4.0, -2.8, 2.4, fy-0.17, 13, 0.30);   // ribs (deck underside)
  });

  // bold column grid — front row heavy, back row quiet
  COLX.forEach(cx => {
    addThickBox(0.55, H, 0.55, cx, H/2,  1.8, 0.60);   // front row (thick)
    addBox     (0.40, H, 0.40, cx, H/2, -2.3, 0.32);   // back row (subtle)
  });

  // bold beams tying the columns at each level
  FLOOR.concat([H-0.25]).forEach(by => {
    addThickBox(W-2.0, 0.42, 0.42, 0, by, 1.8, 0.50);
  });

  // ground-floor entry opening (simple, centred)
  addBox(2.4, 3.0, 0.18, 0, 1.5, frontZ-0.25, 0.42);

  // ==========================================================================
  //  STRUCTURAL / REVERSE-ENGINEERING LAYER  (frame, foundation, grid, dims)
  // ==========================================================================
  const COLZ = [1.8, -2.3];

  // -- foundation footings under every column ---------------------------------
  COLX.forEach(cx => COLZ.forEach(cz => addBox(1.1, 0.5, 1.1, cx, -0.45, cz, 0.42)));

  // -- primary beam frame on each deck (x-beams + z-beams = structural grid) ---
  FLOOR.forEach(fy => {
    COLZ.forEach(cz => addBox(W-2.0, 0.28, 0.28, 0, fy-0.15, cz, 0.40));            // beams along X
    COLX.forEach(cx => addBox(0.28, 0.28, (COLZ[0]-COLZ[1])+0.8, cx, fy-0.15, (COLZ[0]+COLZ[1])/2, 0.40)); // beams along Z
  });

  // -- diagonal cross-bracing on both side bays (classic frame stiffening) ----
  [-3.4, 3.4].forEach(sx => {
    const lv = [0.2, FLOOR[0], FLOOR[1]];
    for(let k=0;k<lv.length-1;k++){
      const y0=lv[k], y1=lv[k+1], zf=COLZ[0], zb=COLZ[1];
      addSeg([sx,y0,zf, sx,y1,zb], 0.34);   // brace ╱
      addSeg([sx,y0,zb, sx,y1,zf], 0.34);   // brace ╲
    }
  });

  // -- construction column grid : axes + bubbles + labels ---------------------
  (function(){
    const bubY = 0.0, bubZ = frontZ + 1.6, labels = ["A","B","C"];
    COLX.forEach((cx,i) => {
      addSeg([cx, 0.4, bubZ, cx, H, frontZ-0.1], 0.16, ORANGE_DIM); // faint axis up to frame
      addRing(cx, bubY, bubZ, 0.62, 0.4, ORANGE_DIM);
      makeLabel(labels[i], 0.7, cx, bubY, bubZ+0.02, 0.0);
    });
  })();

  // -- dimension lines with ticks (engineering-drawing signature) -------------
  (function(){
    // WIDTH dimension along the base front
    const dy = -1.4, dz = frontZ + 0.6, x0=-5.5, x1=5.5;
    const wpts = [x0,dy,dz, x1,dy,dz];                       // main line
    [x0, 0, x1].forEach(x => wpts.push(x,dy-0.3,dz, x,dy+0.3,dz)); // ticks
    wpts.push(x0,dy,dz, x0,-0.1,dz, x1,dy,dz, x1,-0.1,dz);   // witness lines
    addSeg(wpts, 0.30, ORANGE_DIM);

    // HEIGHT dimension along the right side
    const hx = 6.7, hz = 0, y0=0, y1=H;
    const hpts = [hx,y0,hz, hx,y1,hz];
    FLOOR.concat([y0,y1]).forEach(y => hpts.push(hx-0.3,y,hz, hx+0.3,y,hz)); // ticks at each level
    hpts.push(hx,y0,hz, W/2+0.1,y0,hz, hx,y1,hz, W/2+0.1,y1,hz);            // witness lines
    addSeg(hpts, 0.30, ORANGE_DIM);
  })();

  // -- ANNOTATIONS : architect numbers + geometric accessories (supporting) ----
  (function(){
    const dz = frontZ + 0.6;

    // dimension values
    annot("11.00 M", 0.5, 0, -1.95, dz, 0.7);
    const hv = annot("9.00 M", 0.5, 7.35, 4.5, 0, 0.65); hv.rotation.z = Math.PI/2;

    // floor elevation tags (right side, next to the height ticks)
    [["±0.00",0],["+3.30",FLOOR[0]],["+5.90",FLOOR[1]],["+9.00",H]].forEach(e=>{
      annot(e[0], 0.42, 8.55, e[1], 0, 0.6);
    });

    // grid-axis spacing between bubbles
    annot("3.40", 0.4, -1.7, -0.9, frontZ+1.6, 0.55);
    annot("3.40", 0.4,  1.7, -0.9, frontZ+1.6, 0.55);

    // building data / title tags
    annot("± 88 M²",     0.5, -4.7, -1.95, dz, 0.62);
    annot("SKALA 1:100", 0.4,  4.6, -1.7,  dz, 0.5);
    annot("REV.01",      0.4,  4.6, -2.25, dz, 0.45);

    // scale bar 0–4 M
    (function(){
      const y=-2.55, z=dz, x0=-1.7, x1=1.7, pts=[x0,y,z, x1,y,z];
      for(let i=0;i<=4;i++){ const x=x0+(x1-x0)*i/4; pts.push(x,y,z, x,y+0.16,z); }
      addSeg(pts, 0.4, ORANGE_DIM);
      annot("0", 0.3, x0, y-0.28, z, 0.55);
      annot("4 M", 0.34, x1+0.45, y-0.28, z, 0.55);
    })();

    // compass / north arrow (legend accessory)
    (function(){
      const cx=-6.7, cy=1.5, cz=3.8;
      addRing(cx, cy, cz, 0.55, 0.5, ORANGE_DIM, 26);
      addSeg([cx,cy-0.45,cz, cx,cy+0.68,cz,
              cx-0.22,cy+0.28,cz, cx,cy+0.68,cz,
              cx+0.22,cy+0.28,cz, cx,cy+0.68,cz], 0.55, ORANGE);
      annot("N", 0.42, cx, cy+1.05, cz, 0.7);
    })();

    // angle callout near the stair slope
    (function(){
      const vx=5.2, vy=0.5, vz=3.6;
      addSeg([vx,vy,vz, vx+1.7,vy,vz, vx,vy,vz, vx+1.5,vy+0.83,vz], 0.4, ORANGE_DIM);
      addArc(vx,vy,vz, 0.95, 0, 29*Math.PI/180, 0.4, ORANGE_DIM);
      annot("29°", 0.36, vx+1.3, vy+0.34, vz, 0.6);
    })();

    // survey crosshairs (geometric markers)
    crosshair(-W/2, H, D/2, 0.42, 0.4);
    crosshair(3.4, FLOOR[1], 1.8, 0.34, 0.38);

    // viewfinder corner brackets framing the whole model
    (function(){
      const z=frontZ+2.0, X=6.4, yb=0.3, yt=9.3, s=0.9;
      [[-X,yb,1,1],[X,yb,-1,1],[X,yt,-1,-1],[-X,yt,1,-1]].forEach(c=>{
        addSeg([c[0],c[1],z, c[0]+c[2]*s,c[1],z, c[0],c[1],z, c[0],c[1]+c[3]*s,z], 0.26, ORANGE_DIM);
      });
    })();
  })();

  // -- external staircase on the right (slanted) -------------------------------
  (function(){
    const g = new THREE.BoxGeometry(0.4, 6.6, 2.6);
    g.rotateX(-0.5);
    g.translate(3.9, 3.0, 1.6);
    addEdges(g, 0.5, ORANGE, 1);
    // a few step rungs
    const pts=[];
    for(let i=0;i<7;i++){ const t=i/6, y=0.4+t*5.0, z=3.0-t*3.2; pts.push(3.2,y,z, 4.6,y,z); }
    const bg=new THREE.BufferGeometry();
    bg.setAttribute("position", new THREE.Float32BufferAttribute(pts,3));
    model.add(new THREE.LineSegments(bg, edgeMat(ORANGE, 0.4)));
  })();

  // -- FRONT FACADE : arch (inverted-U) with the signature wavy cave-mouth ------
  (function(){
    const s = new THREE.Shape();
    s.moveTo(-5.5, 2.6);
    s.lineTo(-5.5, 9.0);
    s.lineTo( 5.5, 9.0);
    s.lineTo( 5.5, 2.6);
    s.lineTo( 3.6, 2.6);            // inner right leg (bottom)
    s.lineTo( 3.6, 5.4);            // up
    // wavy underside of the parapet (organic opening)
    s.quadraticCurveTo( 3.0, 6.5,  2.2, 5.9);
    s.quadraticCurveTo( 1.4, 5.3,  0.6, 6.2);
    s.quadraticCurveTo(-0.2, 6.9, -1.0, 6.1);
    s.quadraticCurveTo(-1.9, 5.4, -2.7, 6.2);
    s.quadraticCurveTo(-3.3, 6.7, -3.6, 5.4);
    s.lineTo(-3.6, 2.6);           // down inner left leg
    s.lineTo(-5.5, 2.6);           // close
    const geom = new THREE.ExtrudeGeometry(s, { depth:0.35, bevelEnabled:false, curveSegments:20 });
    geom.translate(0, 0, frontZ - 0.35);   // front face flush at +Z
    addEdges(geom, 0.6, ORANGE, 20);
  })();

  // -- "YEN BANGUNAN" sign — the focal point (bright, with glow backing) -------
  (function(){
    // soft glow halo behind the text so the eye lands here first
    (function(){
      const gc=document.createElement("canvas"); gc.width=512; gc.height=256;
      const g=gc.getContext("2d");
      const gr=g.createRadialGradient(256,128,0, 256,128,150);
      gr.addColorStop(0,"rgba(255,150,70,0.9)");
      gr.addColorStop(0.4,"rgba(255,110,40,0.35)");
      gr.addColorStop(1,"rgba(255,90,20,0)");
      g.fillStyle=gr; g.fillRect(0,0,512,256);
      const t=new THREE.CanvasTexture(gc);
      const m=new THREE.MeshBasicMaterial({map:t, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide});
      const halo=new THREE.Mesh(new THREE.PlaneGeometry(11.5, 3.4), m);
      halo.position.set(0, 7.55, frontZ - 0.02);
      model.add(halo);
      registerReveal(halo, 0.55, 7.0);
    })();

    const cv = document.createElement("canvas");
    cv.width = 1800; cv.height = 260;
    const ctx = cv.getContext("2d");
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.font = "800 150px ui-monospace, Menlo, Consolas, monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const txt = "YEN BANGUNAN", ls = 18;
    let total = 0; for(const ch of txt) total += ctx.measureText(ch).width + ls;
    function draw(){ let x=(cv.width-total)/2; for(const ch of txt){ const w=ctx.measureText(ch).width; ctx.fillText(ch, x+w/2, 138); x+=w+ls; } }
    ctx.fillStyle = "#ff8a3a"; ctx.shadowColor="#ff7a2a"; ctx.shadowBlur=34; draw(); // glow pass
    ctx.shadowBlur=0; ctx.fillStyle = "#fff0dc"; draw();                              // crisp bright core
    const tex = new THREE.CanvasTexture(cv); tex.anisotropy = 8;
    const mat = new THREE.MeshBasicMaterial({ map:tex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide });
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(9.8, 1.42), mat);
    plane.position.set(0, 7.55, frontZ + 0.12);
    model.add(plane);
    registerReveal(plane, 1, 7.2);
  })();

  // ---------------------------------------------------------------------------
  //  Glowing joint nodes (soft additive sprites at every registered corner)
  // ---------------------------------------------------------------------------
  (function(){
    const c = document.createElement("canvas"); c.width=c.height=64;
    const g = c.getContext("2d");
    const grd = g.createRadialGradient(32,32,0, 32,32,32);
    grd.addColorStop(0,"rgba(255,200,150,1)");
    grd.addColorStop(0.25,"rgba(255,130,60,0.8)");
    grd.addColorStop(1,"rgba(255,90,20,0)");
    g.fillStyle=grd; g.fillRect(0,0,64,64);
    const tex = new THREE.CanvasTexture(c);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(nodePositions,3));
    const mat = new THREE.PointsMaterial({
      size:0.5, map:tex, color:ORANGE_NODE, transparent:true, opacity:0.45,
      blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true
    });
    const pts = new THREE.Points(geo, mat);
    model.add(pts);
    registerReveal(pts, 0.45, 1.2);
  })();

  // volumetric-ish core: a very dim additive silhouette to give the mass "body"
  (function(){
    const g = new THREE.BoxGeometry(W-0.6, H-0.4, D-0.6);
    g.translate(0, H/2, 0);
    const m = new THREE.MeshBasicMaterial({ color:0x612206, transparent:true, opacity:0.06, blending:THREE.AdditiveBlending, depthWrite:false });
    const mesh = new THREE.Mesh(g, m);
    model.add(mesh);
    registerReveal(mesh, 0.06, 0.0);
  })();

  // -- SCAN SWEEP : a bright frame that travels up & down (reverse-engineering) -
  const scan = (function(){
    const w=W+1.2, d=D+1.2, hw=w/2, hd=d/2;
    const pts=[ -hw,0,-hd,  hw,0,-hd,   hw,0,-hd,  hw,0,hd,
                 hw,0,hd,  -hw,0,hd,   -hw,0,hd, -hw,0,-hd ];
    // corner brackets for a "scanner" look
    [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]].forEach(c=>{
      const sx=Math.sign(c[0])||1, sz=Math.sign(c[1])||1;
      pts.push(c[0],0,c[1], c[0]-sx*0.9,0,c[1], c[0],0,c[1], c[0],0,c[1]-sz*0.9);
    });
    const g=new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(pts,3));
    const seg=new THREE.LineSegments(g, edgeMat(0xffd0a0, 0.55));
    seg.visible=false;                 // shown after the build-up intro
    model.add(seg);
    return seg;
  })();

  // start facing the arch (slight 3/4) for the upward hero angle
  model.rotation.y = -0.22;

  // ---------------------------------------------------------------------------
  //  Interaction : slow 360° auto-rotate + mouse hover parallax / tilt
  // ---------------------------------------------------------------------------
  const AUTO_SPEED = (Math.PI*2)/30;   // one full turn ~ 30s (perlahan)
  let yaw = model.rotation.y;
  let mx = 0, my = 0;                   // normalised mouse (-1..1)
  let tMx = 0, tMy = 0;                 // targets
  let hinted = false;
  const hint = document.getElementById("hint");

  function setMouse(px, py){
    tMx = (px/window.innerWidth)*2 - 1;
    tMy = (py/window.innerHeight)*2 - 1;
    if(!hinted){ hinted = true; hint.classList.add("hide"); }
  }
  window.addEventListener("mousemove", e => setMouse(e.clientX, e.clientY));
  window.addEventListener("mouseleave", () => { tMx = 0; tMy = 0; });
  window.addEventListener("touchmove", e => {
    if(e.touches[0]) setMouse(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});

  const clock = new THREE.Clock();
  const INTRO_DUR = 3.8, TOP = H + 2.5;
  let intro = 0;

  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);

    // --- build-up intro: members appear bottom -> top (construction sequence) --
    if(intro < INTRO_DUR + 0.5){
      intro += dt;
      const p = Math.min(intro / INTRO_DUR, 1);
      const eased = 1 - Math.pow(1 - p, 3);            // easeOutCubic
      const front = eased * (TOP + 2) - 1;             // rising build front
      const band = 1.6;
      for(const r of revealables){
        const o = Math.max(0, Math.min(1, (front - r.y) / band));
        r.obj.material.opacity = r.target * o;
      }
      if(p >= 1) scan.visible = true;
    }

    // --- scanning sweep travelling up & down ---------------------------------
    if(scan.visible){
      const t = clock.getElapsedTime();
      scan.position.y = (0.5 - 0.5*Math.cos(t * 0.9)) * H;      // 0..H ease in/out
      scan.material.opacity = 0.3 + 0.3*Math.abs(Math.sin(t*0.9));
    }

    // damp mouse
    mx += (tMx - mx) * 0.05;
    my += (tMy - my) * 0.05;

    // continuous rotation + hover nudge on top
    yaw += AUTO_SPEED * dt;
    model.rotation.y = yaw + mx * 0.45;
    model.rotation.x = -0.02 + my * 0.22;

    // subtle camera parallax (low upward hero angle)
    camera.position.x = mx * 2.4;
    camera.position.y = 1.7 - my * 1.3;
    camera.lookAt(0, 6.2, 0);

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>
</html>
